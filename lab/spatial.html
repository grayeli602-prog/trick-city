<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spatial · Trick Map test</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="lab.css">
<link rel="stylesheet" href="spatial.css">
<script>
  document.documentElement.classList.add(matchMedia("(pointer: coarse)").matches && !matchMedia("(hover: hover)").matches ? "phone" : "pc");
</script>
<script type="module" src="spatial.js"></script>
</head>
<body class="sp">
<div class="sp-map" id="map"></div>
<div class="sp-top">
  <div id="labBar"></div>
  <div class="sp-tr">
    <div class="sp-layers" id="layers" role="tablist" aria-label="Stance layer"></div>
    <button class="sp-btn" type="button" id="gear" aria-label="Display settings" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</div>
<div class="sp-prefs" id="prefs" hidden></div>
<div class="sp-tier" id="tier" aria-live="polite"></div>
<div class="sp-nav">
  <div class="sp-mini" id="mini" role="img" aria-label="Minimap. Tap or drag to move around."></div>
  <div class="sp-zoom">
    <button class="sp-btn" type="button" data-z="in" aria-label="Zoom in">+</button>
    <button class="sp-btn" type="button" data-z="out" aria-label="Zoom out">−</button>
    <button class="sp-btn" type="button" data-z="fit" aria-label="Show the whole map"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<div class="sp-card" id="card" hidden role="region" aria-label="Selected trick"></div>
<div class="sp-toast" id="toast" role="status" aria-live="polite"></div>
<noscript>This test version needs JavaScript turned on.</noscript>
</body>
</html>
