<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trick Map">
<meta name="description" content="Map your flatground skate tricks: Sun, Earth and Moon.">
<title>Trick Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // Phone or PC layout, decided before first paint.
  document.documentElement.classList.add(matchMedia("(pointer: coarse)").matches && !matchMedia("(hover: hover)").matches ? "phone" : "pc");
</script>
<script type="module" src="js/app/main.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Trick Map</h1>
    <div class="seg views" id="views" role="group" aria-label="View"></div>
    <button class="btn primary" id="newTrick" type="button">+ New trick</button>
    <div class="gearwrap">
      <button class="gear" type="button" aria-label="Settings" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.3c.4-1.7 3-1.7 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.6-1c-1.5.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1-2.5c-.9-1.6.9-3.3 2.4-2.4a1.7 1.7 0 0 0 2.6-1.1z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="dot" hidden></span>
      </button>
      <div class="settings" hidden></div>
    </div>
  </header>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <main class="stage">
    <div class="mapview" id="mapview"></div>
    <div class="gridview" id="gridview" hidden></div>
  </main>
  <div class="legend" id="legend"></div>
  <details class="panel" id="ingredientsPanel">
    <summary>Ingredients and colors</summary>
    <div class="pb" id="ingredients"></div>
  </details>
</div>
<noscript>Trick Map needs JavaScript turned on.</noscript>
</body>
</html>
