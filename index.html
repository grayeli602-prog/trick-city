<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Trick Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar → map split into Sun / Earth / Moon bands (columns = number of ingredients), draggable orbs → bottom sheet breakdown → ingredient builder */
:root{
  --bg:#fafaf8; --fg:#111111; --muted:#84847e; --faint:#c9c8c2; --line:#e6e5e0; --chip:#f1f0ec; --sheet:#ffffff;
  --sunband:#fff4dc; --earthband:#f2f2ee; --moonband:#e7e8f1; --moonink:#1d2033;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111110; --fg:#f0f0ec; --muted:#8e8e88; --faint:#4b4b47; --line:#272725; --chip:#1c1c1a; --sheet:#1a1a19;
  --sunband:#241f13; --earthband:#171716; --moonband:#12131c; --moonink:#05060c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111110; --fg:#f0f0ec; --muted:#8e8e88; --faint:#4b4b47; --line:#272725; --chip:#1c1c1a; --sheet:#1a1a19;
  --sunband:#241f13; --earthband:#171716; --moonband:#12131c; --moonink:#05060c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.mono{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:flex;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:500 13px var(--sans);padding:5px 9px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--fg);background:var(--chip)}
.btn{border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:6px 11px;font:500 13px var(--sans);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.small{padding:3px 9px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.map{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);-webkit-overflow-scrolling:touch}
.map svg{display:block}
.map text{font-family:var(--sans)}
.orb{cursor:grab;touch-action:none}
.orb.dragging{cursor:grabbing}
.map svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pop{position:absolute;z-index:6;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;gap:5px;width:max-content}
.pop .pt{font-size:12px;font-weight:600;padding:0 2px}
.pop .pr{display:flex;gap:3px}
.pop button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:7px;padding:6px 8px;font:500 12px var(--sans);cursor:pointer;white-space:nowrap}
.pop button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toast{min-height:20px;font-size:13px;color:var(--muted)}
.toast b{color:var(--fg);font-weight:600}
.orbpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.opick{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:10px;padding:6px 6px 6px;font:500 12px var(--sans);cursor:pointer}
.opick b{font:500 11px var(--mono);color:var(--muted)}
.opick[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
#prefs{gap:14px}
.map.touch{overflow:hidden;height:60vh;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));border-radius:0;border-left:0;border-right:0;touch-action:none;overscroll-behavior:contain}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;z-index:4}
.zoom button{min-width:40px;height:40px;border:1px solid var(--line);background:var(--sheet);color:var(--fg);border-radius:10px;font:500 16px var(--sans);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
@media (max-width:560px){
  .grow{grid-template-columns:minmax(0,1fr) repeat(4,48px)}
  .gname{font-size:13px;padding:12px 8px}
  .gname span{white-space:normal;overflow:visible;line-height:1.25}
  .ghead{font-size:10px}
  #prefs{gap:8px}
  .seg button{padding:6px 8px}
  .lv button{padding:9px 2px;font-size:12px}
}
.top{position:relative;align-items:center}
.gearwrap{position:relative}
.gear{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:none;color:var(--fg);border-radius:10px;cursor:pointer}
.gear[aria-expanded="true"]{background:var(--chip)}
.settings{position:absolute;right:0;top:46px;z-index:30;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.18);padding:12px;display:flex;flex-direction:column;gap:10px;width:max-content;max-width:calc(100vw - 32px)}
#prefs{display:flex;flex-direction:column;gap:10px}
#prefs .seg{flex-wrap:nowrap;align-items:center}
#prefs .seg .mono{width:62px;flex:0 0 auto}
#mapwrap .toast{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 170px);z-index:3;pointer-events:none;font-size:12px;line-height:1.35;min-height:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
#mapwrap .toast:empty{display:none}
html.fsmode .wrap>*:not(#mapwrap){display:none!important}
html.fsmode body{padding:0!important;background:var(--bg)}
html.fsmode .wrap{max-width:none;gap:0}
#mapwrap.fs{position:relative;background:var(--bg)}
#mapwrap.fs .map.touch{height:var(--fsh,100dvh);margin:0;border:0;border-radius:0}
html.fsmode,html.fsmode body{overflow:hidden;overscroll-behavior:none;height:100%;touch-action:none}
.fsx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:5;width:42px;height:42px;border:1px solid var(--line);background:var(--sheet);color:var(--fg);border-radius:12px;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.expand{position:absolute;inset:0;z-index:4;border:0;background:transparent;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;cursor:pointer}
.expand span{background:var(--fg);color:var(--bg);font:600 14px var(--sans);padding:10px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#mapwrap.fs .zoom{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:calc(10px + env(safe-area-inset-right,0px))}
#mapwrap.fs .toast{bottom:calc(10px + env(safe-area-inset-bottom,0px))}

.phoneonly{display:none}
html.phone .phoneonly{display:flex}
html.phone{padding:0}
html.phone,html.phone body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
html.phone body{padding:0}
html.phone .wrap{max-width:none;gap:0}
html.phone header.top,html.phone .wrap>.bar,html.phone .wrap>.legend{display:none!important}
.pbar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));height:calc(52px + env(safe-area-inset-top,0px))}
.pbar .seg{flex:1;min-width:0}
.pbar .btn{white-space:nowrap;padding:7px 11px}
.pbar .gear{width:38px;height:38px}
html.phone #mapwrap{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));bottom:0;z-index:5}
html.phone #map{height:100%;border:0;border-radius:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
html.phone #map.touch{overflow:hidden;touch-action:none;margin:0;height:100%}
html.phone #map .grid{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
html.phone .settings{top:44px;max-height:calc(100dvh - 80px);overflow:auto}
html.phone #mapwrap .toast{bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 20px)}
html.phone #builder{display:none}
html.phone #builder.sheetopen{display:block;position:fixed;inset:0;z-index:45;overflow:auto;border:0;border-radius:0;background:var(--bg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html.phone #builder.sheetopen summary::after{content:"Done";font:600 14px var(--sans);color:var(--fg)}
html.phone .irow{grid-template-columns:34px minmax(0,1fr) 92px 28px}
#mapwrap{position:relative}
.grid{display:flex;flex-direction:column;min-width:340px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,60px);align-items:center;border-bottom:1px solid var(--line)}
.ghead{position:sticky;top:0;background:var(--bg);font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 0}
.ghead span{text-align:center}.ghead .on{color:var(--fg)}
.gband{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 6px}
.gband.sun{background:var(--sunband)}.gband.earth{background:var(--earthband)}.gband.moon{background:var(--moonband)}
.gname{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--fg);font:500 14px var(--sans);text-align:left;padding:14px 12px;cursor:pointer;min-width:0}
.gname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.gcell{border:0;background:none;display:grid;place-items:center;height:52px;cursor:pointer;-webkit-touch-callout:none;user-select:none}
.gcell:hover{background:var(--chip)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);
  max-height:72vh;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sin{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.shead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.nameinput{font:600 19px var(--sans);color:var(--fg);background:none;border:0;border-bottom:1px dashed var(--faint);padding:2px 0;width:100%;min-width:0}
.x{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.sec{display:flex;flex-direction:column;gap:7px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.lv button,.side button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:7px 4px;font:500 13px var(--sans);cursor:pointer}
.lv button[aria-pressed="true"],.side button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.side{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ing{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ing i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.ing .nm{flex:1;min-width:0}
.ing small{color:var(--muted);font-size:11px;margin-left:6px}
.step{display:flex;align-items:center;gap:2px}
.step button{width:28px;height:28px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:7px;font:500 15px var(--sans);cursor:pointer}
.step span{width:22px;text-align:center;font:500 13px var(--mono)}
.addrow{display:flex;gap:6px}
.addrow select{flex:1;min-width:0;font:500 13px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:4px 10px;font:500 12px var(--sans);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%}
textarea{width:100%;min-height:64px;font:400 13px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:0}
.sec+.sec{border-top:1px solid var(--line);padding-top:14px}
.footctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.footctl input[type=range]{flex:1;min-width:140px;accent-color:var(--fg)}
.chip[disabled]{opacity:.4;cursor:default}

/* builder */
.panel{border:1px solid var(--line);border-radius:14px}
.panel summary{cursor:pointer;padding:12px 14px;font:600 14px var(--sans);list-style:none;display:flex;justify-content:space-between}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
.panel[open] summary::after{content:"–"}
.pb{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.irow{display:grid;grid-template-columns:34px 1fr 112px 30px;gap:6px;align-items:center}
.irow input[type=text],.irow select{font:500 13px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0;width:100%}
input[type=color]{width:32px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.del{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.sidecolors{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.sidecolors label{display:flex;align-items:center;gap:6px}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
html.fsmode{padding:0}
</style>

</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>Trick Map</h1>
    <div class="gearwrap"><button class="gear" id="gear" aria-label="Settings" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.3c.4-1.7 3-1.7 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.6-1c-1.5.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1-2.5c-.9-1.6.9-3.3 2.4-2.4a1.7 1.7 0 0 0 2.6-1.1z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <div class="settings" id="settings" hidden><div class="mono">Settings</div><div id="prefs"></div><div class="legend phoneonly" id="legend2"></div><button class="btn phoneonly" id="openIngs">Ingredients and colors</button><p class="hint" id="syncline" style="max-width:280px"></p></div></div>
  </header>

  <div class="bar">
    <div class="seg" id="stance" role="group" aria-label="View"></div>
    <button class="btn primary" id="newTrick">+ New trick</button>
  </div>

  <div id="mapwrap"><div class="toast" id="toast"></div><div class="map" id="map"></div><button class="expand" id="expand" hidden><span>Tap to open the map</span></button><button class="fsx" id="fsx" hidden aria-label="Close map">×</button><div class="zoom" id="zoom" hidden><button data-z="out" aria-label="Zoom out">−</button><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit">Fit</button></div><div class="pop" id="pop" hidden></div></div>
  <div class="legend" id="legend"></div>

  <details class="panel" id="builder">
    <summary>Ingredients and colors</summary>
    <div class="pb">
      <p class="hint">Every trick is an ollie plus ingredients. Edit these or add your own. Side decides whether a trick lands on Sun or Moon.</p>
      <div id="ings" style="display:flex;flex-direction:column;gap:6px"></div>
      <div><button class="btn" id="addIng">+ Add ingredient</button></div>
      <div class="sidecolors" id="sidecolors"></div>
    </div>
  </details>
</div>

<div class="sheet" id="sheet" hidden></div>

<script>
/* ===== defaults ===== */
const DEFAULT_INGS=[
 {id:"kf",name:"Kickflip",color:"#ff5a3c",side:"sun",builtin:1},
 {id:"bs",name:"Pop shove",color:"#3f78ff",side:"sun",builtin:1},
 {id:"fb",name:"FS 180",color:"#2fb35f",side:"sun",builtin:1},
 {id:"hf",name:"Heelflip",color:"#f2b01e",side:"moon",builtin:1},
 {id:"fs",name:"FS shove",color:"#17a8a0",side:"moon",builtin:1},
 {id:"bb",name:"BS 180",color:"#8c5cf0",side:"moon",builtin:1},
 {id:"bvb",name:"BS body varial",color:"#e2559b",side:"moon",builtin:1,addon:1},
 {id:"bvf",name:"FS body varial",color:"#8fbf2f",side:"sun",builtin:1,addon:1}
];
const SIDES={sun:"Sun",earth:"Earth",moon:"Moon"};
const DEFAULT_SIDECOL={sun:"#ffcc4d",moon:"#1d2033",earth:"#6f9a7a"};
const STANCES=["regular","fakie","switch","nollie"];
const LEVELS=["Not yet","Want it","Landed","Locked in"];
const OLD=["","s:bs1","s:fs1","s:bs2","s:fs2","b:bs1","b:fs1","b:bs2","b:fs2","s:bs2|b:bs1","s:fs2|b:fs1",
 "f:k1","f:k2","f:k1|s:bs1","f:k1|s:fs1","f:k1|s:bs2","f:k1|s:fs2","f:k1|b:bs1","f:k1|b:fs1","f:k1|s:bs2|b:bs1",
 "f:h1","f:h2","f:h1|s:fs1","f:h1|s:bs1","f:h1|s:fs2","f:h1|s:bs2","f:h1|b:bs1","f:h1|b:fs1"];
const OLDMAP={"s:bs":"bs","s:fs":"fs","f:k":"kf","f:h":"hf","b:bs":"bb","b:fs":"fb"};
function oldToRecipe(k){const r={};if(!k) return r;for(const p of k.split("|")){const[g,v]=p.split(":");r[OLDMAP[g+":"+v.slice(0,-1)]]=+v.slice(-1)}return r}
const CATALOG=OLD.map(k=>keyOf(oldToRecipe(k)));

/* ===== recipe helpers ===== */
function keyOf(r){return Object.keys(r).filter(k=>r[k]>0).sort().map(k=>`${k}:${r[k]}`).join(",")}
function recipe(key){const r={};if(!key) return r;for(const p of key.split(",")){const[i,n]=p.split(":");r[i]=+n}return r}
const total=r=>Object.values(r).reduce((a,b)=>a+b,0);
function unitList(r){const u=[];for(const id of Object.keys(r).sort((a,b)=>ingIndex(a)-ingIndex(b))) for(let i=0;i<r[id];i++) u.push(id);return u}

/* ===== naming (built-in tricks keep real names) ===== */
const FLIPSHOVE={kbs1:"varial kickflip",kfs1:"hardflip",kbs2:"360 flip",kfs2:"360 hardflip",hfs1:"varial heelflip",hbs1:"inward heelflip",hfs2:"laser flip",hbs2:"360 inward heelflip"};
function classicName(r,st){
  const s={d:null,n:0},f={d:null,n:0},b={d:null,n:0};

$("map").addEventListener("pointermove",e=>{
  if(PHONE&&S.view==="map"&&tp.has(e.pointerId)){tp.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pz&&tp.size>=2){const[a,b]=[...tp.values()].slice(0,2),r=$("map").getBoundingClientRect(),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
      Z.z=Math.max(1,Math.min(4,pz.z*Math.hypot(a.x-b.x,a.y-b.y)/pz.d));
      Z.tx=mx-(pz.mx-pz.tx)/pz.z*Z.z;Z.ty=my-(pz.my-pz.ty)/pz.z*Z.z;applyZ();return}}
  if(TOUCH&&tp.has(e.pointerId)){tp.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&tp.size===2){const[a,b]=[...tp.values()],r=$("map").getBoundingClientRect(),nz=Math.max(.25,Math.min(2.5,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));
      zoomBy(nz/VZ.z,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
    if(pan){const dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;if(pan.long) return;if(!pan.moved&&Math.hypot(dx,dy)<8) return;
      pan.moved=true;clearTimeout(pan.lp);hidePop();VZ.x=pan.x+dx;VZ.y=pan.y+dy;clampVZ();applyVZ();return}
  }
  if(!drag) return;const kx=PHONE?PT.sx*Z.z:TOUCH&&FS&&VZ.sx?VZ.sx:(TOUCH?VZ.z:1),ky=PHONE?PT.sy*Z.z:TOUCH&&FS&&VZ.sy?VZ.sy:(TOUCH?VZ.z:1),dx=(e.clientX-drag.sx)/kx,dy=(e.clientY-drag.sy)/ky;
  if(drag.long) return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7) return;drag.moved=true;clearTimeout(drag.lp);hidePop();drag.g.classList.add("dragging");
  const n=drag.n,svgEl=$("svg");
  if(PHONE){n.x=Math.min(PT.x1,Math.max(PT.x0,drag.ox+dx));n.y=Math.min(drag.M.H-30/PT.sy,Math.max(14/PT.sy,drag.oy+dy));const p=P(n);drag.g.setAttribute("transform",`translate(${p.x},${p.y})`)}
  else{const MW=+svgEl.getAttribute("width")-14,MH=+svgEl.getAttribute("height")-14;n.x=Math.min(MW,Math.max(14,drag.ox+dx));n.y=Math.min(MH,Math.max(14,drag.oy+dy));drag.g.setAttribute("transform",`translate(${n.x},${n.y}) scale(${ORBK()})`)}
  for(const p of drag.edges){const[a,b]=p.dataset.e.split(">");p.setAttribute("d",edgePath(P(drag.M.map.get(a)),P(drag.M.map.get(b))))}
});
function endTouch(e){
  if(PHONE&&tp.has(e.pointerId)){tp.delete(e.pointerId);if(tp.size<2)pz=null;return}
  if(!TOUCH||!tp.has(e.pointerId)) return;tp.delete(e.pointerId);if(tp.size<2)pinch=null;
  if(pan&&tp.size===0){const p=pan;pan=null;clearTimeout(p.lp);
    if(!p.moved&&!p.long){if(p.k!==null){hidePop();sel=sel===p.k?null:p.k;if(sel===null)$("sheet").hidden=true;render()}else if($("pop").hidden===false)hidePop()}}
}
function endDrag(){
  if(!drag) return;clearTimeout(drag.lp);const{k,n,moved,M,long}=drag;drag=null;
  if(long) return;
  if(!moved){hidePop();sel=sel===k?null:k;if(sel===null)$("sheet").hidden=true;render();return}
  if(moveK===k) moveK=null;
  S.pos[k]={x:Math.round(n.x),y:Math.round(n.y)};
  if(S.layout!=="custom"){S.layout="custom";for(const m of M.nodes) if(!S.pos[m.k]) S.pos[m.k]={x:m.ax,y:m.ay}}
  const zone=bandAt(M,n.y);
  if(zone!==sideOf(k)){S.side[k]=zone;toast=`<b>${esc(nameOf(k))}</b> moved to ${SIDES[zone]}`}else toast="";
  if(zone===autoSide(k)&&S.side[k]===zone) delete S.side[k];
  save();render();
}
$("map").addEventListener("pointerup",e=>{endTouch(e);endDrag()});$("map").addEventListener("pointercancel",e=>{endTouch(e);endDrag()});
$("expand").onclick=()=>setFS(true);$("fsx").onclick=()=>setFS(false);
$("zoom").addEventListener("click",e=>{const b=e.target.closest("[data-z]");if(!b) return;const z=b.dataset.z;if(z==="in")zoomBy(1.3);else if(z==="out")zoomBy(1/1.3);else fitVZ()});




/* ===== stance grid ===== */
const lvAt=(k,st)=>S.levels[`${st}|${k||"ollie"}`]||0;
function dotSvg(lv,size=18){const c=size/2,r=size*.3;
  if(lv===0) return `<svg width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`;
  if(lv===1) return `<svg width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--fg)" stroke-width="1.6"/></svg>`;
  if(lv===2) return `<svg width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="var(--fg)"/></svg>`;
  return `<svg width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r+2.6}" fill="none" stroke="var(--fg)"/><circle cx="${c}" cy="${c}" r="${r}" fill="var(--fg)"/></svg>`}
function gridHtml(M){
  const ST=[["regular","Reg"],["fakie","Fakie"],["switch","Switch"],["nollie","Nollie"]];
  let h=`<div class="grid"><div class="grow ghead"><span></span>${ST.map(([st,l])=>`<span class="gcol${st===S.stance?" on":""}">${l}</span>`).join("")}</div>`;
  for(const sd of ["sun","earth","moon"]){const rows=M.nodes.filter(n=>n.side===sd).sort((a,b)=>a.fl-b.fl||(a.ay-b.ay));if(!rows.length) continue;
    h+=`<div class="gband ${sd}"><span class="gbicon">${bandIcon(sd).replace(/^/,'<svg width="12" height="12" viewBox="-6 -6 12 12">')+"</svg>"}</span>${SIDES[sd]}</div>`;
    for(const n of rows){const nm=S.names[n.k]||autoName(n.k,"regular");
      h+=`<div class="grow"><button class="gname" data-open="${esc(n.k)}"><i style="background:${n.col}"></i><span>${esc(nm)}</span></button>${ST.map(([st])=>`<button class="gcell" data-cell="${esc(n.k)}" data-cst="${st}" aria-label="${esc(nm)} ${st}: ${LEVELS[lvAt(n.k,st)]}">${dotSvg(lvAt(n.k,st))}</button>`).join("")}</div>`}}
  return h+`</div>`}

/* ===== level popover: hover (mouse) / long-press (touch) ===== */
let popK=null,popSt=null,popHide=null,popShow=null;
function anchorFor(k,st){if(st) return [...document.querySelectorAll(".gcell")].find(x=>x.dataset.cell===k&&x.dataset.cst===st);
  const g=[...document.querySelectorAll(".orb")].find(x=>x.dataset.k===k);return g&&g.querySelector("circle")}
function showPop(k,st){
  const a=anchorFor(k,st);if(!a) return;
  popK=k;popSt=st||null;const stance=st||S.stance,pop=$("pop"),cur=lvAt(k,stance);
  pop.innerHTML=`<div class="pt">${esc(autoName(k,stance)===nameOf(k)||!S.names[k]?autoName(k,stance):S.names[k])}${st?` <span style="color:var(--muted);font-weight:500">· ${st}</span>`:""}</div><div class="pr">${LEVELS.map((l,i)=>`<button data-plv="${i}" aria-pressed="${cur===i}">${l}${i===1?` <span style="opacity:.6">${Object.values(S.levels).filter(v=>v===1).length}/3</span>`:""}</button>`).join("")}</div>`;
  pop.hidden=false;
  const wr=$("mapwrap").getBoundingClientRect(),r=a.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=r.left-wr.left+r.width/2-pw/2,y=r.top-wr.top-ph-8;
  x=Math.max(4,Math.min(wr.width-pw-4,x));if(y<4) y=r.bottom-wr.top+8;
  pop.style.left=x+"px";pop.style.top=y+"px";
}
function hidePop(){$("pop").hidden=true;popK=null;popSt=null}
$("pop").addEventListener("click",e=>{if(e.target.closest("[data-move]")&&popK!==null){moveK=popK;toast=`Drag <b>${esc(nameOf(moveK))}</b> to its new spot.`;hidePop();renderBars();return}
  const b=e.target.closest("[data-plv]");if(!b||popK===null) return;
  {const st0=popSt||S.stance,k0=popK,v0=+b.dataset.plv,cur0=S.levels[`${st0}|${k0||"ollie"}`]||0;
   if(v0===1&&cur0!==1){const wants=Object.keys(S.levels).filter(x=>S.levels[x]===1);if(wants.length>=3){toast=`You can only want 3 tricks at a time. Drop one first: ${wants.map(x=>{const i=x.indexOf("|"),st=x.slice(0,i),kk=x.slice(i+1);return esc(autoName(kk==="ollie"?"":kk,st))}).join(", ")}.`;renderBars();const pt=$("pop").querySelector(".pt");if(pt){pt.textContent="3 wants max. Drop one first.";pt.style.color="var(--kf, #e0483a)"}return}}}
  const k=popK,st=popSt,v=+b.dataset.plv,key=`${st||S.stance}|${k||"ollie"}`;
  if(v)S.levels[key]=v;else delete S.levels[key];toast=`<b>${esc(autoName(k,st||S.stance))}</b> · ${LEVELS[v]}`;save();render();
  if(matchMedia("(hover:hover)").matches) showPop(k,st);else hidePop()});
$("pop").addEventListener("pointerenter",()=>clearTimeout(popHide));
$("pop").addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")popHide=setTimeout(hidePop,250)});
$("map").addEventListener("pointerover",e=>{if(e.pointerType!=="mouse"||drag) return;const g=e.target.closest(".orb,.gcell");if(!g) return;
  clearTimeout(popHide);clearTimeout(popShow);const k=g.dataset.k??g.dataset.cell,st=g.dataset.cst;popShow=setTimeout(()=>showPop(k,st),180)});
$("map").addEventListener("click",e=>{const c=e.target.closest(".gcell");if(c){clearTimeout(popHide);showPop(c.dataset.cell,c.dataset.cst);return}
  const o=e.target.closest("[data-open]");if(o){hidePop();sel=o.dataset.open;render()}});
$("map").addEventListener("pointerout",e=>{if(e.pointerType!=="mouse") return;const g=e.target.closest(".orb,.gcell");if(!g||g.contains(e.relatedTarget)) return;
  clearTimeout(popShow);popHide=setTimeout(hidePop,300)});
$("map").addEventListener("contextmenu",e=>{if(e.target.closest(".orb"))e.preventDefault()});
$("map").addEventListener("scroll",hidePop);
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#pop")&&!e.target.closest(".orb,.gcell")) hidePop()});

/* ===== top bar ===== */
$("gear").onclick=e=>{e.stopPropagation();renderSync();const o=$("settings").hidden;$("settings").hidden=!o;$("gear").setAttribute("aria-expanded",o)};
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".gearwrap"))$("settings").hidden=true,$("gear").setAttribute("aria-expanded",false)});
document.addEventListener("click",e=>{
  const pf=e.target.closest("[data-pref]");if(pf){S[pf.dataset.pref]=pf.dataset.val;toast="";save();render();return}
  const o=e.target.closest("[data-orb]");if(o){S.orbStyle=+o.dataset.orb;save();render();return}
  const t=e.target.closest("[data-st],[data-f],[data-view]");if(!t) return;
  if(t.dataset.view){S.view=t.dataset.view;hidePop();toast=""}
  if(t.dataset.st){S.stance=t.dataset.st;toast=""}
  if(t.dataset.f){S.filter=t.dataset.f;toast=""}
  save();render();
});
$("newTrick").onclick=()=>{sel="";toast="Start from the ollie and add ingredients below.";render();setTimeout(()=>$("addSel")&&$("addSel").focus(),50)};


/* ===== ingredient builder ===== */
function renderIngs(){
  $("ings").innerHTML=S.ings.map((g,i)=>`<div class="irow"><input type="color" data-ic="${i}" value="${g.color}" aria-label="Color for ${esc(g.name)}">
    <input type="text" data-in="${i}" value="${esc(g.name)}" aria-label="Ingredient name">
    <select data-is="${i}" aria-label="Side">${Object.entries(SIDES).map(([v,l])=>`<option value="${v}" ${g.side===v?"selected":""}>${l}</option>`).join("")}</select>
    ${g.builtin?"<span></span>":`<button class="del" data-idel="${i}" aria-label="Delete ${esc(g.name)}">×</button>`}</div>`).join("");
  $("sidecolors").innerHTML=Object.entries(SIDES).map(([v,l])=>`<label><input type="color" data-sc="${v}" value="${S.sideCol[v]}"> ${l} color</label>`).join("");
}
$("builder").addEventListener("input",e=>{const t=e.target;
  if(t.dataset.ic!==undefined){S.ings[+t.dataset.ic].color=t.value;save();render()}
  else if(t.dataset.in!==undefined){S.ings[+t.dataset.in].name=t.value||"Untitled";save();clearTimeout(window.__it);window.__it=setTimeout(()=>render(true),400)}
  else if(t.dataset.sc){S.sideCol[t.dataset.sc]=t.value;save();render()}});
$("builder").addEventListener("change",e=>{const t=e.target;if(t.dataset.is!==undefined){S.ings[+t.dataset.is].side=t.value;save();render()}});
$("builder").addEventListener("click",e=>{const t=e.target.closest("[data-idel]");if(!t) return;const g=S.ings[+t.dataset.idel];
  S.ings.splice(+t.dataset.idel,1);S.custom=S.custom.filter(k=>!(g.id in recipe(k)));save();renderIngs();render()});
$("addIng").onclick=()=>{const id="c"+Date.now().toString(36);S.ings.push({id,name:"New ingredient",color:"#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0"),side:"earth"});save();renderIngs();
  const inp=document.querySelector(`[data-in="${S.ings.length-1}"]`);if(inp){inp.focus();inp.select()}};


if(PHONE){document.documentElement.classList.add("phone");["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));S.view=S.view||"map";
  const bar=document.createElement("div");bar.className="pbar";bar.append($("stance"),$("newTrick"),document.querySelector(".gearwrap"));document.body.prepend(bar);
  $("openIngs").onclick=()=>{$("settings").hidden=true;const b=$("builder");b.open=true;b.classList.add("sheetopen");b.scrollTop=0};
  $("builder").addEventListener("toggle",()=>{if(!$("builder").open)$("builder").classList.remove("sheetopen")});
  let rt;const rr=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==="map")render(true)},120)};addEventListener("resize",rr);addEventListener("orientationchange",rr);
}
renderIngs();render();
if(PHONE) requestAnimationFrame(()=>render(true));
